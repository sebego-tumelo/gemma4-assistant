<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemma 4 Focus & Brainstorm</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121214; color: #e1e1e6; max-width: 600px; margin: 40px auto; padding: 20px; }
    textarea { width: 100%; height: 120px; background: #202024; border: 1px solid #323238; color: #fff; padding: 12px; border-radius: 6px; resize: none; font-size: 16px; box-sizing: border-box; }
    button { background: #04d361; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 12px; font-size: 16px; }
    button:disabled { background: #4d4d56; cursor: not-allowed; }
    #output { margin-top: 30px; background: #202024; padding: 20px; border-radius: 6px; line-height: 1.6; white-space: pre-wrap; display: none; border-left: 4px solid #04d361; }
  </style>
</head>
<body>
  <h1>⚡ Gemma 4 Focus Engine</h1>
  <p>Dump your messy thoughts, projects, or goals below. Gemma will distill them into a hyper-focused 3-step action plan.</p>
  
  <textarea id="topicInput" placeholder="e.g., 'I want to launch a tech blog but I don't know if I should use WordPress or NextJS, and I have zero article ideas...'"></textarea>
  <button id="generateBtn">Generate Action Plan</button>

  <div id="output"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
